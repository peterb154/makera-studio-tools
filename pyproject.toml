[project]
name = "makera-studio-tools"
version = "0.1.0"
description = "Unofficial reader, checker and MCP server for Makera Studio projects (.mks)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3"]

[project.scripts]
makera-check = "makera_studio_tools.cli:main"
makera-studio-mcp = "makera_studio_tools.server:main"
makera-rotary = "makera_studio_tools.rotary_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
